name: Deploy frontend to GitHub Pages

# Only the frontend deploys here — GitHub Pages can't run the Node backend
# in /server. Deploy that separately (see README) and point VITE_API_URL
# at it below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # Set this to your deployed backend's URL once it's hosted
          # (see README "Going live" section). Falls back to localhost,
          # which only works if you're testing on your own machine.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:4000/api' }}
          # Must match your repo name, e.g. /manga-store/
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
